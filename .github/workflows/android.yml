name: Build APK - BY Finance Manager

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -20
          yes | sdkmanager --licenses || true

      - name: Fix gradlew permission
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-debug.log
          echo "=== APKs after debug build ==="
          find app/build -name "*.apk" -type f -ls || echo "No APK found"
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Build Release APK
        if: success()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log
          echo "=== APKs after release build ==="
          find app/build -name "*.apk" -type f -ls || echo "No APK found"
          ls -lh app/build/outputs/apk/release/ || true

      - name: List all outputs
        if: always()
        run: |
          echo "=== All build outputs ==="
          find . -name "*.apk" -o -name "*.log" | head -20
          ls -R app/build/outputs/ 2>&1 | head -100 || true
          echo "=== TAIL DEBUG LOG ==="
          tail -n 400 build-debug.log || true

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-finance-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-finance-manager-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Create Final Artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/BY-Finance-Manager-v1.0-debug.apk || cp app/build/outputs/apk/debug/app-debug.apk artifacts/BY-Finance-Manager-v1.0-debug.apk || true
          cp app/build/outputs/apk/release/*.apk artifacts/BY-Finance-Manager-v1.0-release.apk || cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BY-Finance-Manager-v1.0-release.apk || true
          ls -lh artifacts/

      - name: Upload Final APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BY-Finance-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Save logs to repo branch for debugging
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Saving logs to repo..."
          # Get log tail
          tail -n 500 build-debug.log > /tmp/fail.log 2>/dev/null || echo "no log" > /tmp/fail.log
          # Encode
          CONTENT=$(base64 -w 0 /tmp/fail.log)
          # Try to create file via API on a new branch logs/failure-${{ github.run_id }}
          # First get current commit sha of arena branch
          BRANCH="arena/01a0b0b8-finance-manager"
          # Create file in logs directory on same branch via API (will create commit)
          gh api --method PUT repos/${{ github.repository }}/contents/build-logs/failure-${{ github.run_id }}.log \
            -f message="ci: add build failure log for run ${{ github.run_id }}" \
            -f content="$CONTENT" \
            -f branch="$BRANCH" || echo "Failed to push log via API, trying git push"
          # Also try git method
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin $BRANCH
          git checkout $BRANCH
          mkdir -p build-logs
          cp /tmp/fail.log build-logs/failure-${{ github.run_id }}.log
          git add build-logs/
          git commit -m "ci: add build failure log for run ${{ github.run_id }}" || true
          git push origin $BRANCH || true
