name: Build APK - BY Finance Manager

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -20
          yes | sdkmanager --licenses || true

      - name: Fix gradlew permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-debug.log
          find app/build -name "*.apk" -type f -ls || echo "No APK found"

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log
          find app/build -name "*.apk" -type f -ls || echo "No APK found"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-finance-manager-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Final Artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BY-Finance-Manager-v1.0-debug.apk || cp app/build/outputs/apk/debug/*.apk artifacts/BY-Finance-Manager-v1.0-debug.apk || true
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BY-Finance-Manager-v1.0-release.apk || cp app/build/outputs/apk/release/*.apk artifacts/BY-Finance-Manager-v1.0-release.apk || true
          ls -lh artifacts/
          # Also create version with commit hash
          cp artifacts/BY-Finance-Manager-v1.0-debug.apk artifacts/BY-Finance-Manager-${{ github.sha }}-debug.apk || true
          cp artifacts/BY-Finance-Manager-v1.0-release.apk artifacts/BY-Finance-Manager-${{ github.sha }}-release.apk || true

      - name: Upload Final APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BY-Finance-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error

  release:
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: BY-Finance-Manager-APKs
          path: apks

      - name: List APKs
        run: |
          ls -lh apks/
          du -h apks/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="v1.0.${{ github.run_number }}"
          echo "Creating release $TAG"
          cat > /tmp/release_notes.md <<EOF
          ## BY Финансы - Финансовый менеджер 🇧🇾

          ### 📱 Скачать APK:
          - **Debug APK** (29MB, для тестирования, с логами) - \`BY-Finance-Manager-v1.0-debug.apk\`
          - **Release APK** (19MB, оптимизированный) - \`BY-Finance-Manager-v1.0-release.apk\`

          ### Возможности:
          - 💰 Учёт доходов и расходов в белорусских рублях (BYN)
          - 💵 Автоматический пересчёт в доллары США (USD) по курсу НБРБ на день оплаты
          - 📊 Баланс, общие суммы прихода/расхода в обеих валютах
          - 🏷️ Источники доходов и расходов с кастомизацией (иконки, названия)
          - 📅 Курс НБРБ загружается автоматически с api.nbrb.by
          - 📱 Работает оффлайн, кэширует курсы

          ### Установка:
          1. Скачайте APK файл
          2. Разрешите установку из неизвестных источников в настройках Android
          3. Установите APK

          ### Технические детали:
          - Курс USD: https://api.nbrb.by/exrates/rates/USD?ondate=YYYY-MM-DD&parammode=2
          - Формула: USD = BYN / курс_НБРБ
          - База данных: Room
          - Минимальная версия Android: 7.0 (API 24)
          - Сборка: GitHub Actions

          ---
          Автоматическая сборка из коммита ${{ github.sha }}
          Ветка: ${{ github.ref }}
          Дата сборки: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          cat /tmp/release_notes.md
          # Create release without assets first
          gh release create "$TAG" --title "BY Финансы $TAG" --notes-file /tmp/release_notes.md --latest || echo "Release may already exist"
          # Upload assets one by one
          for apk in apks/*.apk; do
            echo "Uploading $apk..."
            gh release upload "$TAG" "$apk" --clobber || echo "Failed to upload $apk"
          done
          echo "Release assets:"
          gh release view "$TAG" --json assets --jq '.assets[] | .name' || true
