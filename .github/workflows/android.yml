name: Build APK - BY Finance Manager

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -50
          yes | sdkmanager --licenses || true

      - name: Fix gradlew permission
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-debug.log
          echo "=== APKs after debug build ==="
          find app/build -name "*.apk" -type f -ls || echo "No APK found"
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Build Release APK
        if: success()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log
          echo "=== APKs after release build ==="
          find app/build -name "*.apk" -type f -ls || echo "No APK found"
          ls -lh app/build/outputs/apk/release/ || true

      - name: List all outputs
        if: always()
        run: |
          echo "=== All build outputs ==="
          find . -name "*.apk" -o -name "*.log" | head -20
          ls -R app/build/outputs/ 2>&1 | head -100 || true

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-finance-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-finance-manager-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Create Final Artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/BY-Finance-Manager-v1.0-debug.apk || cp app/build/outputs/apk/debug/app-debug.apk artifacts/BY-Finance-Manager-v1.0-debug.apk || true
          cp app/build/outputs/apk/release/*.apk artifacts/BY-Finance-Manager-v1.0-release.apk || cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BY-Finance-Manager-v1.0-release.apk || true
          ls -lh artifacts/

      - name: Upload Final APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BY-Finance-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Save logs to repo on failure
        if: failure()
        run: |
          echo "Build failed, saving logs to branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Create orphan branch for logs
          git checkout --orphan temp-logs-${{ github.run_id }}
          git rm -rf . || true
          mkdir -p logs
          cp $GITHUB_WORKSPACE/build-debug.log logs/ 2>/dev/null || echo "no debug log" > logs/build-debug.log
          cp $GITHUB_WORKSPACE/build-release.log logs/ 2>/dev/null || echo "no release log" > logs/build-release.log
          # Also capture gradle reports if exist
          find $GITHUB_WORKSPACE -name "*.log" -type f -exec cp {} logs/ \; 2>/dev/null || true
          echo "# Build logs for run ${{ github.run_id }}" > README.md
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> README.md
          git add .
          git commit -m "Add build logs for run ${{ github.run_id }}"
          git push origin HEAD:logs/run-${{ github.run_id }} --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
