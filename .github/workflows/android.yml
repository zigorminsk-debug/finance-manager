name: Build APK - BY Finance Manager

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -20
          yes | sdkmanager --licenses || true

      - name: Fix gradlew permission
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-debug.log
          echo "=== APKs after debug build ==="
          find app/build -name "*.apk" -type f -ls || echo "No APK found"
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Build Release APK
        if: success()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log
          echo "=== APKs after release build ==="
          find app/build -name "*.apk" -type f -ls || echo "No APK found"
          ls -lh app/build/outputs/apk/release/ || true

      - name: List all outputs
        if: always()
        run: |
          echo "=== All build outputs ==="
          find . -name "*.apk" -o -name "*.log" | head -20
          ls -R app/build/outputs/ 2>&1 | head -100 || true
          echo "=== TAIL DEBUG LOG ==="
          tail -n 500 build-debug.log || true

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-finance-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-finance-manager-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Create Final Artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/BY-Finance-Manager-v1.0-debug.apk || cp app/build/outputs/apk/debug/app-debug.apk artifacts/BY-Finance-Manager-v1.0-debug.apk || true
          cp app/build/outputs/apk/release/*.apk artifacts/BY-Finance-Manager-v1.0-release.apk || cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BY-Finance-Manager-v1.0-release.apk || true
          ls -lh artifacts/

      - name: Upload Final APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BY-Finance-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Create issue with logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating issue with build failure logs..."
          # Extract compilation errors
          echo "=== Extracting errors ==="
          grep -n "e: " build-debug.log | head -n 100 > /tmp/errors.txt || echo "No e: lines" > /tmp/errors.txt
          grep -n "error:" build-debug.log | head -n 100 >> /tmp/errors.txt || true
          grep -n "FAILURE" build-debug.log | head -n 20 >> /tmp/errors.txt || true
          cat /tmp/errors.txt
          # Also get 50 lines before first e:
          FIRST_ERROR_LINE=$(grep -n "e: " build-debug.log | head -n 1 | cut -d: -f1)
          if [ -n "$FIRST_ERROR_LINE" ]; then
            START=$((FIRST_ERROR_LINE > 100 ? FIRST_ERROR_LINE - 100 : 1))
            sed -n "${START},${FIRST_ERROR_LINE}p" build-debug.log > /tmp/context.txt
            echo "=== Context around first error ==="
            cat /tmp/context.txt
          else
            echo "No first error line found"
            tail -n 500 build-debug.log > /tmp/context.txt
          fi
          # Create issue body
          {
            echo "Build failed for run ${{ github.run_id }}"
            echo ""
            echo "**Commit:** ${{ github.sha }}"
            echo "**Branch:** ${{ github.ref }}"
            echo "**Workflow:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "### Compilation errors (grep e:):"
            echo '```'
            cat /tmp/errors.txt
            echo '```'
            echo ""
            echo "### Context around first error:"
            echo '```'
            cat /tmp/context.txt
            echo '```'
            echo ""
            echo "### Full tail (last 300 lines):"
            echo '```'
            tail -n 300 build-debug.log
            echo '```'
          } > /tmp/issue_body.md
          gh issue create --title "Build failure log for run ${{ github.run_id }}" --body-file /tmp/issue_body.md --label "bug" || echo "Failed to create issue"
          # Also print to summary
          echo "### Build Failure" >> $GITHUB_STEP_SUMMARY
          cat /tmp/issue_body.md >> $GITHUB_STEP_SUMMARY || true
