name: Build APK - BY Finance Manager

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -20
          yes | sdkmanager --licenses || true

      - name: Fix gradlew permission
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-debug.log
          find app/build -name "*.apk" -type f -ls || echo "No APK found"
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Build Release APK
        if: success()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log
          find app/build -name "*.apk" -type f -ls || echo "No APK found"
          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-finance-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-finance-manager-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Create Final Artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/BY-Finance-Manager-v1.0-debug.apk || cp app/build/outputs/apk/debug/app-debug.apk artifacts/BY-Finance-Manager-v1.0-debug.apk || true
          cp app/build/outputs/apk/release/*.apk artifacts/BY-Finance-Manager-v1.0-release.apk || cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BY-Finance-Manager-v1.0-release.apk || true
          ls -lh artifacts/

      - name: Upload Final APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BY-Finance-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Create issue with logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -n "e: " build-debug.log | head -n 100 > /tmp/errors.txt || echo "No e: lines" > /tmp/errors.txt
          {
            echo "Build failed for run ${{ github.run_id }}"
            echo "**Commit:** ${{ github.sha }} **Branch:** ${{ github.ref }}"
            echo "Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "### Errors:"
            echo '```'
            cat /tmp/errors.txt
            echo '```'
            echo ""
            echo "### Tail:"
            echo '```'
            tail -n 300 build-debug.log
            echo '```'
          } > /tmp/issue_body.md
          gh issue create --title "Build failure log for run ${{ github.run_id }}" --body-file /tmp/issue_body.md --label "bug" || true

  release:
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: BY-Finance-Manager-APKs
          path: apks

      - name: List APKs
        run: ls -lh apks/

      - name: Create GitHub Release with gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="v1.0.${{ github.run_number }}"
          echo "Creating release $TAG"
          # Create release notes
          cat > /tmp/release_notes.md <<EOF
          ## BY Финансы - Финансовый менеджер 🇧🇾

          ### Возможности:
          - 💰 Учёт доходов и расходов в белорусских рублях (BYN)
          - 💵 Автоматический пересчёт в доллары США (USD) по курсу НБРБ на день оплаты
          - 📊 Баланс, общие суммы прихода/расхода в обеих валютах
          - 🏷️ Источники доходов и расходов с кастомизацией (иконки, названия)
          - 📅 Курс НБРБ загружается автоматически с api.nbrb.by
          - 📱 Работает оффлайн, кэширует курсы

          ### Установка:
          Скачайте APK файл и установите на Android устройство.

          ### Технические детали:
          - Курс USD: https://api.nbrb.by/exrates/rates/USD?ondate=YYYY-MM-DD&parammode=2
          - Формула: USD = BYN / курс_НБРБ
          - База данных: Room
          - Минимальная версия Android: 7.0 (API 24)

          ---
          Автоматическая сборка из коммита ${{ github.sha }}
          Ветка: ${{ github.ref }}
          EOF
          cat /tmp/release_notes.md
          # Try gh release create
          gh release create "$TAG" apks/*.apk --title "BY Финансы $TAG" --notes-file /tmp/release_notes.md || echo "gh release create failed, trying action"
          # If failed, try with --draft false
          gh release view "$TAG" || echo "Release not found after create"

      - name: Fallback - Create Release via Action
        if: failure()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "BY Финансы v1.0.${{ github.run_number }}"
          body: |
            ## BY Финансы - Финансовый менеджер 🇧🇾
            Автоматическая сборка из коммита ${{ github.sha }}
          files: apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on release failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Release failed, creating issue..."
          gh issue create --title "Release failure for run ${{ github.run_id }}" --body "Release job failed for https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} - check logs" --label "bug" || true
