name: Build APK - BY Finance Manager

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -20
          yes | sdkmanager --licenses || true

      - name: Fix gradlew permission
        run: chmod +x gradlew

      - name: Verify keystore exists (permanent key)
        run: |
          echo "Checking for permanent keystore..."
          ls -lh app/release.keystore || echo "Keystore not found!"
          ls -lh app/keystore.properties || echo "Properties not found!"
          cat app/keystore.properties || true
          echo "Keystore SHA256:"
          sha256sum app/release.keystore || true
          # Verify keystore can be read
          keytool -list -keystore app/release.keystore -storepass byfinance123 -alias byfinance || echo "keytool list failed, trying with openssl"
          openssl pkcs12 -info -in app/release.keystore -passin pass:byfinance123 -nokeys | head -20 || true

      - name: Build Debug APK (signed with permanent key)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-debug.log
          echo "=== APKs after debug build ==="
          find app/build -name "*.apk" -type f -ls || echo "No APK found"
          ls -lh app/build/outputs/apk/debug/ || true
          # Verify signature
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/*.apk || true

      - name: Build Release APK (signed with permanent key)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log
          echo "=== APKs after release build ==="
          find app/build -name "*.apk" -type f -ls || echo "No APK found"
          ls -lh app/build/outputs/apk/release/ || true
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/*.apk || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-finance-manager-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Final Artifacts (signed)
        if: success()
        run: |
          mkdir -p artifacts
          # Debug signed with permanent key
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BY-Finance-Manager-v1.0-debug-signed.apk || cp app/build/outputs/apk/debug/*.apk artifacts/BY-Finance-Manager-v1.0-debug-signed.apk || true
          # Release signed with permanent key
          cp app/build/outputs/apk/release/app-release.apk artifacts/BY-Finance-Manager-v1.0-release-signed.apk || cp app/build/outputs/apk/release/*.apk artifacts/BY-Finance-Manager-v1.0-release-signed.apk || true
          # Also keep old names for compatibility
          cp artifacts/BY-Finance-Manager-v1.0-debug-signed.apk artifacts/BY-Finance-Manager-v1.0-debug.apk || true
          cp artifacts/BY-Finance-Manager-v1.0-release-signed.apk artifacts/BY-Finance-Manager-v1.0-release.apk || true
          # Version with commit hash
          cp artifacts/BY-Finance-Manager-v1.0-debug-signed.apk artifacts/BY-Finance-Manager-${{ github.sha }}-debug-signed.apk || true
          cp artifacts/BY-Finance-Manager-v1.0-release-signed.apk artifacts/BY-Finance-Manager-${{ github.sha }}-release-signed.apk || true
          ls -lh artifacts/
          echo "=== Verifying final APKs ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs artifacts/*.apk || true

      - name: Upload Final APKs (signed with permanent key)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BY-Finance-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error

  release:
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: BY-Finance-Manager-APKs
          path: apks

      - name: List APKs
        run: |
          ls -lh apks/
          du -h apks/*

      - name: Create GitHub Release (signed APKs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="v1.0.${{ github.run_number }}"
          echo "Creating release $TAG with permanently signed APKs"
          cat > /tmp/release_notes.md <<EOF
          ## BY Финансы - Финансовый менеджер 🇧🇾 (Подписанный APK)

          ### 📱 Скачать APK (подписан постоянным ключом):
          - **Debug Signed APK** - \`BY-Finance-Manager-v1.0-debug-signed.apk\` (подписан ключом byfinance, для тестирования)
          - **Release Signed APK** - \`BY-Finance-Manager-v1.0-release-signed.apk\` (подписан постоянным ключом, для установки)
          - Оба APK подписаны одним постоянным ключом: CN=BY Finance Manager, O=BY Finance, C=BY
          - Keystore: app/release.keystore (SHA256: $(sha256sum apks/BY-Finance-Manager-v1.0-release-signed.apk 2>/dev/null | cut -d' ' -f1 || echo "unknown"))

          ### ✅ Исправления в этом релизе:
          - Исправлено падение приложения при запуске (добавлен android:name=".FinanceApp" в AndroidManifest.xml)
          - Добавлен постоянный ключ подписи (release.keystore) для всех сборок
          - Уменьшены иконки приложения (были 1.3MB, стали 300 bytes) для предотвращения OOM
          - Исправлен DatabaseCallback для надёжной инициализации дефолтных источников
          - Добавлена проверка подписи APK через apksigner

          ### Возможности:
          - 💰 Учёт доходов и расходов в белорусских рублях (BYN)
          - 💵 Автоматический пересчёт в доллары США (USD) по курсу НБРБ на день оплаты
          - 📊 Баланс, общие суммы прихода/расхода в обеих валютах
          - 🏷️ Источники доходов и расходов с кастомизацией (иконки, названия)
          - 📅 Курс НБРБ загружается автоматически с api.nbrb.by
          - 📱 Работает оффлайн, кэширует курсы

          ### Установка:
          1. Скачайте APK файл (рекомендуется release-signed)
          2. Разрешите установку из неизвестных источников в настройках Android
          3. Установите APK
          4. При обновлении используйте тот же ключ подписи - данные сохранятся!

          ### Технические детали:
          - Курс USD: https://api.nbrb.by/exrates/rates/USD?ondate=YYYY-MM-DD&parammode=2
          - Формула: USD = BYN / курс_НБРБ
          - База данных: Room
          - Подпись: постоянный ключ byfinance (valid 10000 days)
          - Минимальная версия Android: 7.0 (API 24)

          ---
          Автоматическая сборка из коммита ${{ github.sha }}
          Ветка: ${{ github.ref }}
          Дата сборки: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Подписан: постоянным ключом BY Finance Manager
          EOF
          cat /tmp/release_notes.md
          gh release create "$TAG" --title "BY Финансы $TAG (signed)" --notes-file /tmp/release_notes.md --latest || echo "Release may already exist, will try upload"
          for apk in apks/*.apk; do
            echo "Uploading $apk..."
            gh release upload "$TAG" "$apk" --clobber || echo "Failed to upload $apk, trying again"
          done
          gh release view "$TAG" --json assets --jq '.assets[] | .name' || true
